<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CSS_B1</title>
    <style>
      body {
        background-color: #ffffcc;
      }
      .center {
        text-align: center;
        color: white;
      }
      h1 {
        background-color: #00cc66;
        color: orange;
      }
      table,
      th,
      td {
        border: 1px solid black;
        border-collapse: collapse;
      }
      table.center {
        background-color: blue;
      }
      .centre,
      .centre th,
      .centre td {
        border: 5px solid blue;
        padding: 15px;
        background-color: #e5e908;
      }
      #s1 {
        background-color: red;
      }
      #s2 {
        background-color: rgb(0, 255, 170);
      }
      div {
        color: blue;
      }
    </style>
  </head>
  <body>
    <h1 class="center">Tabele formatate</h1>
    <div id="s1">
      <table style="width: 100%" class="center">
        <tr>
          <th>Firstname</th>
          <th>Lastname</th>
          <th>Age</th>
        </tr>
        <tr>
          <td>Jill</td>
          <td>Smith</td>
          <td>50</td>
        </tr>
        <tr>
          <td>Eve</td>
          <td>Jackson</td>
          <td>94</td>
        </tr>
      </table>
      <br />
    </div>
    <div id="s2" style="width: 100%">
      <br />
      <table style="width: 100%" class="centre">
        <tr>
          <th class="centre">Firstname</th>
          <th class="centre">Lastname</th>
          <th class="centre">Age</th>
        </tr>
        <tr>
          <td class="centre">Jill</td>
          <td>Smith</td>
          <td>50</td>
        </tr>
        <tr>
          <td class="centre">Eve</td>
          <td>Jackson</td>
          <td>94</td>
        </tr>
      </table>
    </div>

    <!-- Explicatie:
1. Initial, tabelele nu aveau o regula background-color proprie (erau transparente), asa ca prin ele se vedea fundalul parintelui lor (<div id="s1"> rosu, respectiv <div id="s2"> galben). Pentru a schimba doar fundalul primului tabel in albastru fara a schimba culoarea sectiunii #s1, am aplicat background-color: blue pe selectorul table.center.
2. In al doilea tabel, celulele aratau diferit deoarece doar celulele din antet (th) si cele din prima coloana (td) aveau atributul class="centre" in HTML, restul celulelor ramanand cu chenarul subtire de 1px si fara padding. Am uniformizat aspectul aplicand regula pe .centre, .centre th, .centre td. -->
  </body>
</html>
