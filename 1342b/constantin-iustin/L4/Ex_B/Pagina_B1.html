<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CSS_B1</title>
    <style>
      body {
        background-color: #ffffcc;
      }
      .center {
        text-align: center;
        color: white;
      }
      h1 {
        background-color: #00cc66;
        color: rgb(255, 196, 0);
      }
      table,
      th,
      td {
        border: 1px solid black;
        border-collapse: collapse;
      }
      .centre,
      .centre td {
        border: 5px solid rgb(140, 0, 255);
        padding: 15px;
      }
      #s1 {
        background-color: rgb(0, 4, 255);
      }
      #s2 {
        background-color: rgb(208, 255, 0);
      }
      div {
        color: rgb(0, 26, 255);
      }
    </style>
  </head>
  <body>
    <h1 class="center">Tabele formatate</h1>
    <div id="s1">
      <table style="width: 100%" class="center">
        <tr>
          <th>Firstname</th>
          <th>Lastname</th>
          <th>Age</th>
        </tr>
        <tr>
          <td>Jill</td>
          <td>Smith</td>
          <td>50</td>
        </tr>
        <tr>
          <td>Eve</td>
          <td>Jackson</td>
          <td>94</td>
        </tr>
      </table>
      <br />
    </div>
    <div id="s2" style="width: 100%">
      <br />
      <table style="width: 100%" class="centre">
        <tr>
          <th class="centre">Firstname</th>
          <th class="centre">Lastname</th>
          <th class="centre">Age</th>
        </tr>
        <tr>
          <td class="centre">Jill</td>
          <td>Smith</td>
          <td>50</td>
        </tr>
        <tr>
          <td class="centre">Eve</td>
          <td>Jackson</td>
          <td>94</td>
        </tr>
      </table>
    </div>

    <!-- pentru ca tabelel sunt transparente initial si preiau fundalul din div, iar cel de al 2 lea tabel aveau doar o jum din center, cred -->
  </body>
</html>
